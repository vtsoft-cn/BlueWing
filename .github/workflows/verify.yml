name: Verify Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: go1.26.10
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            native/vpn/go.sum
            native/routing/go.sum
      - run: npm ci
      - run: npm audit --audit-level=low --registry=https://registry.npmjs.org
      - run: npm run build:vpn-core
      - run: npm run build:routing-core
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck -mode=binary bin/bluewing-vpn-core.exe
      - run: govulncheck -mode=binary bin/sing-box.exe
      - name: Source security regression
        run: npx tsx --import ./src/__tests__/helpers/encryption.ts --test src/__tests__/public-release-security.test.ts
      - name: Full application tests with bundled runtime materials
        if: hashFiles('bin/rules/geosite-cn.srs') != ''
        run: npm test
      - run: npm run test:vpn-core
      - name: Full runtime integration
        if: hashFiles('bin/rules/geosite-cn.srs') != ''
        run: npm run test:vpn:integration
      - name: Record source-only coverage limit
        if: hashFiles('bin/rules/geosite-cn.srs') == ''
        run: Write-Output 'Source snapshot has no redistributable rule bundle. Full application and runtime integration remain release prerequisites; source security, native, renderer and build checks still run.'
      - run: npm run test:installer
      - run: npm run build
      - run: npm run test:security-ui
      - run: npm run test:startup
      - run: npm run test:vpn:state-ui
      - run: npm run test:vpn:ui
      - run: npm run licenses:inventory
      # A local directory build, with no upload, signing credentials or publication.
      - run: node scripts/dist-wrapper.js --dir --config.directories.output=release-ci --config.npmRebuild=false
