<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="containerL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="184" ry="184"
        fill="url(#containerL)"/>

  <g transform="translate(92 92) scale(0.82)">
    <defs>
      <radialGradient id="oceanL" cx="30%" cy="26%" r="85%">
        <stop offset="0%" stop-color="#93C5FD"/>
        <stop offset="25%" stop-color="#3B82F6"/>
        <stop offset="55%" stop-color="#1D4ED8"/>
        <stop offset="80%" stop-color="#0F2A6B"/>
        <stop offset="100%" stop-color="#050A1F"/>
      </radialGradient>

      <linearGradient id="landL" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#DBEAFE"/>
        <stop offset="50%" stop-color="#93C5FD"/>
        <stop offset="100%" stop-color="#3B82F6"/>
      </linearGradient>

      <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
        <stop offset="30%" stop-color="#2563EB" stop-opacity="0.5"/>
        <stop offset="70%" stop-color="#2563EB" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="atmoL" cx="50%" cy="50%" r="50%">
        <stop offset="70%" stop-color="#60A5FA" stop-opacity="0"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
      </radialGradient>

      <!-- 鸟：比上一版提亮一档 -->
      <linearGradient id="birdL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1E40AF"/>
        <stop offset="35%" stop-color="#2563EB"/>
        <stop offset="70%" stop-color="#0EA5E9"/>
        <stop offset="100%" stop-color="#38BDF8"/>
      </linearGradient>

      <clipPath id="globeClipL">
        <circle cx="512" cy="640" r="210"/>
      </clipPath>
    </defs>

    <g transform="rotate(-16 512 640)">
      <ellipse cx="512" cy="640" rx="410" ry="148"
               fill="none" stroke="url(#ringL)" stroke-width="10"/>
      <ellipse cx="512" cy="640" rx="370" ry="132"
               fill="none" stroke="#2563EB" stroke-width="5"
               opacity="0.22"/>
    </g>

    <circle cx="512" cy="640" r="210" fill="url(#oceanL)"/>

    <g clip-path="url(#globeClipL)">
      <g>
        <path d="M340 540
                 C 400 490, 510 490, 560 550
                 C 610 610, 580 700, 500 720
                 C 420 740, 340 690, 320 620
                 C 305 560, 315 555, 340 540 Z"
              fill="url(#landL)" opacity="0.95"/>
        <path d="M500 720
                 C 580 700, 610 610, 560 550
                 C 570 600, 560 680, 500 720 Z"
              fill="#1E40AF" opacity="0.3"/>
      </g>

      <g>
        <path d="M580 560
                 C 640 540, 700 570, 700 630
                 C 700 690, 650 730, 600 720
                 C 560 710, 550 640, 580 560 Z"
              fill="url(#landL)" opacity="0.8"/>
        <path d="M600 720
                 C 650 730, 700 690, 700 630
                 C 700 680, 660 720, 600 720 Z"
              fill="#1E40AF" opacity="0.3"/>
      </g>

      <ellipse cx="512" cy="640" rx="200" ry="86"
               fill="none" stroke="#BFDBFE" stroke-width="3.5"
               opacity="0.45"
               transform="rotate(-12 512 640)"/>

      <ellipse cx="380" cy="490" rx="110" ry="80"
               fill="#FFFFFF" opacity="0.35"
               transform="rotate(-30 380 490)"/>

      <ellipse cx="350" cy="460" rx="50" ry="35"
               fill="#FFFFFF" opacity="0.5"
               transform="rotate(-30 350 460)"/>

      <ellipse cx="660" cy="810" rx="220" ry="160"
               fill="#050A1F" opacity="0.4"
               style="filter: blur(45px)"/>

      <path d="M650 780
               A 210 210 0 0 0 720 640
               A 200 200 0 0 1 640 770 Z"
            fill="#60A5FA" opacity="0.35"/>
    </g>

    <circle cx="512" cy="640" r="210"
            fill="url(#atmoL)" opacity="0.9"/>

    <g transform="rotate(-16 512 640)">
      <circle cx="122" cy="640" r="26" fill="#2563EB"/>
      <circle cx="902" cy="640" r="26" fill="#2563EB"/>
      <circle cx="512" cy="492" r="22" fill="#3B82F6"/>
      <circle cx="512" cy="788" r="22" fill="#3B82F6"/>
    </g>
    <g transform="rotate(-16 512 640)" fill="#BFDBFE">
      <circle cx="114" cy="630" r="8"/>
      <circle cx="894" cy="630" r="8"/>
    </g>
    <g transform="rotate(-16 512 640)" fill="#1E40AF" opacity="0.35">
      <circle cx="130" cy="650" r="6"/>
      <circle cx="910" cy="650" r="6"/>
    </g>

    <g fill="url(#birdL)" stroke="url(#birdL)"
       stroke-width="54" stroke-linejoin="round">
      <path d="M196 430
               C 400 290, 620 150, 790 118
               C 690 260, 590 380, 512 448
               Z"/>
      <path d="M196 430
               C 350 500, 520 580, 660 650
               C 590 560, 540 500, 512 448
               Z"/>
    </g>

    <path d="M400 370
             C 500 310, 610 240, 700 195
             C 650 250, 590 320, 555 385
             Z"
          fill="#DBEAFE" opacity="0.4"/>

    <path d="M300 470
             C 400 470, 480 450, 512 448
             C 480 470, 400 500, 340 520
             Z"
          fill="#1E3A8A" opacity="0.35"/>
  </g>
</svg>