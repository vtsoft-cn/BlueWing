<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="globeOnLight" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
    <linearGradient id="birdOnLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="birdActiveGlowL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlowOnL" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="globeShadowOnL" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16"
                    flood-color="#1D4ED8" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- 轨道环：变绿 -->
  <ellipse cx="512" cy="600" rx="290" ry="104"
           fill="none" stroke="#22C55E" stroke-width="8" opacity="0.55"
           transform="rotate(-16 512 600)"/>

  <!-- 轨道流动高光弧 -->
  <path d="M240 620 A 290 104 0 0 1 420 520"
        fill="none" stroke="#86EFAC" stroke-width="10"
        stroke-linecap="round" opacity="0.9"
        transform="rotate(-16 512 600)"/>

  <!-- 地球 -->
  <circle cx="512" cy="600" r="152" fill="url(#globeOnLight)"
          filter="url(#globeShadowOnL)"/>
  <ellipse cx="440" cy="520" rx="70" ry="52"
           fill="#FFFFFF" opacity="0.30"
           transform="rotate(-25 440 520)"/>

  <!-- 节点：全部变绿 + 光晕 -->
  <g fill="#22C55E" filter="url(#nodeGlowOnL)">
    <circle cx="262" cy="530" r="18"/>
    <circle cx="782" cy="570" r="18"/>
    <circle cx="632" cy="300" r="18"/>
    <circle cx="368" cy="740" r="15"/>
    <circle cx="692" cy="750" r="15"/>
  </g>
  <g fill="#DCFCE7" opacity="0.95">
    <circle cx="256" cy="524" r="6"/>
    <circle cx="776" cy="564" r="6"/>
    <circle cx="626" cy="294" r="6"/>
  </g>

  <!-- 鸟：加淡青外发光 -->
  <g filter="url(#birdActiveGlowL)"
     fill="url(#birdOnLight)" stroke="url(#birdOnLight)"
     stroke-width="40" stroke-linejoin="round">
    <path d="M300 460
             C 460 350, 640 250, 760 230
             C 680 330, 600 420, 540 470
             Z"/>
    <path d="M300 460
             C 420 510, 560 570, 660 620
             C 600 550, 560 500, 540 470
             Z"/>
  </g>
  <path d="M420 400
           C 520 330, 640 270, 720 250
           C 660 320, 600 380, 560 420
           Z"
        fill="#FFFFFF" opacity="0.18"/>
</svg>