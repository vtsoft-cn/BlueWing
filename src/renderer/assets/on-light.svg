<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="globeOnDark" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F2A6B"/>
    </radialGradient>
    <linearGradient id="birdOnDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="birdGlowOnD" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlowOnD" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 轨道环：变绿 -->
  <ellipse cx="512" cy="600" rx="290" ry="104"
           fill="none" stroke="#22C55E" stroke-width="8" opacity="0.5"
           transform="rotate(-16 512 600)"/>

  <!-- 轨道流动高光弧 -->
  <path d="M240 620 A 290 104 0 0 1 420 520"
        fill="none" stroke="#86EFAC" stroke-width="10"
        stroke-linecap="round" opacity="0.95"
        transform="rotate(-16 512 600)"/>

  <!-- 地球 -->
  <circle cx="512" cy="600" r="152" fill="url(#globeOnDark)"/>
  <ellipse cx="440" cy="520" rx="70" ry="52"
           fill="#FFFFFF" opacity="0.18"
           transform="rotate(-25 440 520)"/>

  <!-- 节点：全部变绿 + 光晕 -->
  <g fill="#22C55E" filter="url(#nodeGlowOnD)">
    <circle cx="262" cy="530" r="18"/>
    <circle cx="782" cy="570" r="18"/>
    <circle cx="632" cy="300" r="18"/>
    <circle cx="368" cy="740" r="15"/>
    <circle cx="692" cy="750" r="15"/>
  </g>
  <g fill="#DCFCE7" opacity="0.9">
    <circle cx="256" cy="524" r="6"/>
    <circle cx="776" cy="564" r="6"/>
    <circle cx="626" cy="294" r="6"/>
  </g>

  <!-- 鸟：强发光 -->
  <g filter="url(#birdGlowOnD)" fill="url(#birdOnDark)" stroke="url(#birdOnDark)"
     stroke-width="40" stroke-linejoin="round">
    <path d="M300 460
             C 460 350, 640 250, 760 230
             C 680 330, 600 420, 540 470
             Z"/>
    <path d="M300 460
             C 420 510, 560 570, 660 620
             C 600 550, 560 500, 540 470
             Z"/>
  </g>
</svg>